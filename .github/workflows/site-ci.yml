name: Source and Worker validation

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate publication and Worker configuration
        run: python scripts/verify_site.py

      - name: Type-check Worker and E2E sources
        run: npm run typecheck

      - name: Run Workers-runtime security and product tests
        run: npm test

      - name: Rehearse isolated D1 recovery and FTS rebuild
        run: npm run test:recovery

      - name: Install locked Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser-enforced CSP and product workflows
        run: npm run test:e2e

      - name: Build preview Worker without deploying
        run: npm run build:worker:preview

      - name: Build production Worker without deploying
        run: npm run build:worker:production

      - name: Verify SHA-256 file manifest
        run: python scripts/generate_manifest.py --check
