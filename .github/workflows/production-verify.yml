name: Production verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify live Cloudflare deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify production URLs, redirects, and headers
        shell: pwsh
        run: |
          $maxAttempts = 8
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Output "PRODUCTION_VERIFY_ATTEMPT=$attempt"
            & pwsh -NoLogo -NoProfile -File ./scripts/verify_deployment.ps1 `
              -BaseUrl "https://militaristhumanism.com" `
              -PagesDevUrl "https://militaristhumanism.pages.dev"
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds 15
            }
          }
          exit 1
